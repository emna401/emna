buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Le plugin Android Gradle pour le projet Android
        classpath 'com.android.tools.build:gradle:8.0.2'

        // Si vous utilisez Kotlin, vous devrez ajouter le plugin Kotlin ici
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"

        // Si vous utilisez Flutter, assurez-vous que le plugin Flutter est inclus
        classpath 'dev.flutter:flutter-gradle-plugin:3.6.0'
        classpath 'com.google.gms:google-services:4.3.8'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
